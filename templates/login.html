<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JETLUXECO — Sign in</title>
<style>
  :root { --bg:#0a0a0a; --surface:#141414; --border:#2a2a2a; --text:#f5f5f5; --muted:#888; --gold:#AE7640; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 48px; max-width: 380px; width: 90%; }
  .brand { text-align: center; margin-bottom: 32px; }
  .brand h1 { font-size: 28px; letter-spacing: 6px; font-weight: 300; }
  .brand .sub { font-size: 10px; letter-spacing: 4px; color: var(--gold); margin-top: 4px; }
  label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; font-family: inherit; font-size: 14px; }
  input:focus { outline: none; border-color: var(--gold); }
  button { width: 100%; margin-top: 20px; background: var(--gold); color: #000; border: none; padding: 12px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
  button:hover { background: #c89868; }
  .error { color: #d9534f; font-size: 12px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>JETLUXECO</h1>
      <div class="sub">EMPTY LEG INTELLIGENCE</div>
    </div>
    <form method="POST" action="/login">
      <label>Password</label>
      <input type="password" name="password" autofocus required>
      <button type="submit">Sign in</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>

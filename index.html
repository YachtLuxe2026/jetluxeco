<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JETLUXECO — Broker Cockpit</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c;
    --border:#2a2a2a; --text:#f5f5f5; --text-muted:#888;
    --gold:#AE7640; --gold-soft:#c89868;
    --green:#5cb85c; --amber:#f0ad4e; --red:#d9534f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  header { padding: 20px 32px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; background: var(--bg); z-index: 100; }
  .logo { font-size: 20px; font-weight: 300; letter-spacing: 6px; }
  .logo .sub { display: block; font-size: 9px; letter-spacing: 3px; color: var(--gold); margin-top: 2px; }
  .stats { display: flex; gap: 24px; }
  .stat { text-align: right; }
  .stat .num { font-size: 22px; font-weight: 300; color: var(--gold); display: block; }
  .stat .label { font-size: 9px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }

  .view-toggle { display: flex; gap: 8px; margin-left: 24px; padding-left: 24px; border-left: 1px solid var(--border); }
  .vt { padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .15s; color: var(--text-muted); font-family: inherit; }
  .vt.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .vt:hover { border-color: var(--gold); color: var(--gold); }
  .vt.active:hover { color: #000; }

  .toolbar { padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .quick-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .qf { padding: 8px 14px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all .15s; font-family: inherit; color: var(--text); }
  .qf:hover { border-color: var(--gold); color: var(--gold); }
  .qf.active { background: var(--gold); color: #000; border-color: var(--gold); }

  .filters { padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .fg { display: flex; flex-direction: column; min-width: 120px; }
  .fg label { font-size: 9px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
  .fg input, .fg select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: inherit; font-size: 13px; }
  .fg input:focus, .fg select:focus { outline: none; border-color: var(--gold); }
  .broker-inputs { margin-left: auto; display: flex; gap: 10px; align-items: end; padding-left: 20px; border-left: 1px solid var(--border); }

  #view-map { display: none; height: calc(100vh - 200px); position: relative; }
  #map { width: 100%; height: 100%; background: #0a0a0a; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  .leaflet-control-attribution { background: rgba(20,20,20,.9) !important; color: var(--text-muted) !important; border: 1px solid var(--border); }
  .leaflet-control-attribution a { color: var(--gold) !important; }
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--gold) !important; border-color: var(--border) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--gold); border-radius: 2px; }
  .leaflet-popup-content { font-family: inherit; font-size: 12px; margin: 12px 14px; min-width: 220px; }
  .leaflet-popup-content strong { color: var(--gold); }
  .leaflet-popup-close-button { color: var(--text-muted) !important; }

  .map-legend { position: absolute; top: 12px; left: 60px; background: rgba(20,20,20,.92); border: 1px solid var(--border); padding: 10px 14px; font-size: 11px; z-index: 1000; }
  .map-legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .map-legend .line { width: 30px; height: 2px; display: inline-block; }
  .line-fl { background: #AE7640; }
  .line-us { background: #5cb85c; }
  .line-intl { background: #6699cc; }

  #view-grid { padding: 20px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); overflow: hidden; transition: all .2s; display: flex; flex-direction: column; }
  .card.fl { border-left: 3px solid var(--gold); }
  .card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .card-img { height: 140px; background: var(--surface-2); background-size: cover; background-position: center; position: relative; }
  .card-img.placeholder { display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 3px; color: var(--text-muted); }
  .card-src { position: absolute; top: 8px; right: 8px; font-size: 9px; letter-spacing: 2px; padding: 3px 8px; background: rgba(10,10,10,.85); color: var(--gold); text-transform: uppercase; border: 1px solid var(--gold); }
  .card-fl { position: absolute; top: 8px; left: 8px; font-size: 9px; letter-spacing: 2px; padding: 3px 8px; background: var(--gold); color: #000; text-transform: uppercase; font-weight: 700; }
  .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
  .card-route { font-size: 20px; letter-spacing: 2px; margin-bottom: 4px; font-weight: 400; }
  .card-route .arrow { color: var(--gold); margin: 0 8px; }
  .card-cities { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .card-meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 8px 0 12px; }
  .meta-item .label { font-size: 8px; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
  .meta-item .value { font-size: 12px; font-weight: 500; }
  .card-price { color: var(--gold); font-size: 20px; font-weight: 300; margin-bottom: 12px; }
  .card-price .broker-tier { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
  .card-price .broker-tier .net { color: var(--green); }
  .card-price .broker-tier .quote { color: var(--gold); font-weight: 500; }
  .card-ops { background: var(--surface-2); padding: 10px 12px; margin: 0 -18px -18px; border-top: 1px solid var(--border); }
  .card-ops .op-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .card-ops .op-contacts { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .card-ops .op-contacts a { padding: 4px 8px; border: 1px solid var(--border); color: var(--text-muted); transition: all .15s; }
  .card-ops .op-contacts a:hover { border-color: var(--gold); color: var(--gold); }
  .conf-pill { display: inline-block; font-size: 8px; letter-spacing: 1.5px; padding: 2px 6px; margin-left: 6px; border-radius: 2px; text-transform: uppercase; font-weight: 700; }
  .conf-high { background: rgba(92,184,92,.2); border: 1px solid var(--green); color: var(--green); }
  .conf-medium { background: rgba(240,173,78,.2); border: 1px solid var(--amber); color: var(--amber); }
  .conf-low { background: rgba(120,120,120,.2); border: 1px solid #888; color: #888; }
  .inferred-marker { font-size: 9px; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; }
  .direct-marker { font-size: 9px; letter-spacing: 1.5px; color: var(--green); text-transform: uppercase; margin-bottom: 3px; }
  .card-tail { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: var(--gold-soft); margin-top: 4px; }
  .card-view-on-map { margin-top: 6px; font-size: 10px; letter-spacing: 1.5px; color: var(--text-muted); cursor: pointer; text-transform: uppercase; }
  .card-view-on-map:hover { color: var(--gold); }

  .phase-pill { display: inline-block; font-size: 9px; letter-spacing: 1.5px; padding: 2px 7px; border-radius: 2px; margin-bottom: 6px; text-transform: uppercase; }
  .phase-cruise, .phase-enroute { background: rgba(92,184,92,.15); border: 1px solid var(--green); color: var(--green); }
  .phase-approach, .phase-descending { background: rgba(240,173,78,.15); border: 1px solid var(--amber); color: var(--amber); }
  .phase-departing { background: rgba(174,118,64,.15); border: 1px solid var(--gold); color: var(--gold); }
  .phase-landed { background: rgba(120,120,120,.15); border: 1px solid #888; color: #888; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1/-1; }
</style>
</head>
<body>

<header>
  <div class="logo">JETLUXECO<span class="sub">BROKER COCKPIT</span></div>
  <div style="display:flex;align-items:center">
    <div class="stats">
      <div class="stat"><span class="num" id="stat-total">—</span><span class="label">Total</span></div>
      <div class="stat"><span class="num" id="stat-fl">—</span><span class="label">Florida</span></div>
      <div class="stat"><span class="num" id="stat-photos">—</span><span class="label">Photos</span></div>
      <div class="stat"><span class="num" id="stat-shown">—</span><span class="label">Shown</span></div>
    </div>
    <div class="view-toggle">
      <button class="vt active" data-view="grid">List</button>
      <button class="vt" data-view="map">Map</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="quick-filters">
    <button class="qf active" data-quick="all">All</button>
    <button class="qf" data-quick="fl">Florida ★</button>
    <button class="qf" data-quick="miami">Miami</button>
    <button class="qf" data-quick="fll">Fort Lauderdale</button>
    <button class="qf" data-quick="pbi">Palm Beach</button>
    <button class="qf" data-quick="usa">USA only</button>
    <button class="qf" data-quick="intl">International</button>
    <button class="qf" data-quick="under5k">Under $5k</button>
    <button class="qf" data-quick="under15k">Under $15k</button>
    <button class="qf" data-quick="next7">Next 7 days</button>
  </div>
</div>

<div class="filters">
  <div class="fg"><label>Origin</label><input id="f-o" type="text" placeholder="KMIA, Miami…" oninput="apply()"></div>
  <div class="fg"><label>Destination</label><input id="f-d" type="text" placeholder="KTEB, NYC…" oninput="apply()"></div>
  <div class="fg"><label>Max price ($)</label><input id="f-max" type="number" placeholder="25000" oninput="apply()"></div>
  <div class="fg"><label>Category</label>
    <select id="f-cat" onchange="apply()">
      <option value="">All</option>
      <option value="very_light">Very Light</option>
      <option value="light">Light</option>
      <option value="midsize">Midsize</option>
      <option value="super_midsize">Super-Mid</option>
      <option value="heavy">Heavy</option>
      <option value="ultra_long">Ultra-Long</option>
      <option value="turboprop">Turboprop</option>
    </select>
  </div>
  <div class="fg"><label>Operator</label><input id="f-op" type="text" placeholder="NetJets, Flexjet…" oninput="apply()"></div>
  <div class="fg"><label>Aircraft</label><input id="f-ac" type="text" placeholder="G650, CJ4…" oninput="apply()"></div>
  <div class="fg"><label>Sort</label>
    <select id="f-sort" onchange="apply()">
      <option value="date">Date</option>
      <option value="price-asc">Price ↑</option>
      <option value="price-desc">Price ↓</option>
      <option value="fl">Florida first</option>
    </select>
  </div>
  <div class="broker-inputs">
    <div class="fg"><label>Discount %</label><input id="f-disc" type="number" value="15" style="width:70px" oninput="apply()"></div>
    <div class="fg"><label>Markup %</label><input id="f-mup" type="number" value="12" style="width:70px" oninput="apply()"></div>
  </div>
</div>

<div id="view-grid"><div class="empty">Loading…</div></div>
<div id="view-map">
  <div id="map"></div>
  <div class="map-legend">
    <div style="font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:6px">ROUTE COLOR</div>
    <div class="row"><span class="line line-fl"></span> Florida endpoint</div>
    <div class="row"><span class="line line-us"></span> USA domestic</div>
    <div class="row"><span class="line line-intl"></span> International</div>
  </div>
</div>

let quickFilter = 'all';
let currentView = 'grid';
let map, routesLayer, markersLayer;

const FL_ICAOS = ['KMIA','KFLL','KOPF','KFXE','KBCT','KPBI','KAPF','KEYW','KTMB','KRSW','KTPA','KJAX','KSGJ','KSSC','KSFB','KMLB','KSUA','KVRB','KVQQ','KHWO','KPMP','KX01','KPHK','KLNA','KFPR','KVNC','KISM','KOCF','KGIF','KDAB','KCRG','KGNV','KTLH','KPNS','KECP'];
const MIAMI_ICAOS = ['KMIA','KOPF','KTMB','KHWO'];
const FLL_ICAOS = ['KFLL','KFXE','KHWO','KPMP','KBCT'];
const PBI_ICAOS = ['KPBI','KBCT','KLNA','KSUA','KVRB'];

const $ = id => document.getElementById(id);
function fmtDate(s){ if(!s) return '—'; return new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function fmtPrice(v){ return '$'+Math.round(v).toLocaleString(); }
function esc(s){ return (s||'').toString().replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function isFL(l){ return FL_ICAOS.includes(l.o) || FL_ICAOS.includes(l.d); }
function isUS(l){ return (l.o && l.o.startsWith('K')) || (l.d && l.d.startsWith('K')); }

document.querySelectorAll('.vt').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.vt').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentView = b.dataset.view;
  $('view-grid').style.display = currentView === 'grid' ? 'grid' : 'none';
  $('view-map').style.display = currentView === 'map' ? 'block' : 'none';
  if (currentView === 'map') { initMap(); apply(); setTimeout(() => map.invalidateSize(), 200); }
}));

document.querySelectorAll('.qf').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.qf').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  quickFilter = b.dataset.quick;
  apply();
}));

function filterLegs(){
  const all = window.__DATA__;
  const o = $('f-o').value.trim().toUpperCase();
  const d = $('f-d').value.trim().toUpperCase();
  const max = parseFloat($('f-max').value) || null;
  const cat = $('f-cat').value;
  const op = $('f-op').value.trim().toLowerCase();
  const ac = $('f-ac').value.trim().toLowerCase();
  const week = new Date(Date.now() + 7*86400000);

  return all.filter(l => {
    if (quickFilter === 'fl' && !isFL(l)) return false;
    if (quickFilter === 'miami' && !(MIAMI_ICAOS.includes(l.o) || MIAMI_ICAOS.includes(l.d))) return false;
    if (quickFilter === 'fll' && !(FLL_ICAOS.includes(l.o) || FLL_ICAOS.includes(l.d))) return false;
    if (quickFilter === 'pbi' && !(PBI_ICAOS.includes(l.o) || PBI_ICAOS.includes(l.d))) return false;
    if (quickFilter === 'usa' && !isUS(l)) return false;
    if (quickFilter === 'intl' && isUS(l)) return false;
    if (quickFilter === 'under5k' && (!l.p || l.p > 5000)) return false;
    if (quickFilter === 'under15k' && (!l.p || l.p > 15000)) return false;
    if (quickFilter === 'next7' && (!l.dt || new Date(l.dt) > week)) return false;
    if (o && !((l.o||'').includes(o) || (l.oc||'').toUpperCase().includes(o))) return false;
    if (d && !((l.d||'').includes(d) || (l.dc||'').toUpperCase().includes(d))) return false;
    if (max && (!l.p || l.p > max)) return false;
    if (cat && l.cat !== cat) return false;
    if (op && !((l.op||'').toLowerCase().includes(op) || (l.iop||'').toLowerCase().includes(op))) return false;
    if (ac && !(l.ac||'').toLowerCase().includes(ac)) return false;
    return true;
  });
}

function apply(){
  let filtered = filterLegs();
  const sort = $('f-sort').value;
  if (sort === 'price-asc') filtered.sort((a,b) => (a.p||9e9) - (b.p||9e9));
  else if (sort === 'price-desc') filtered.sort((a,b) => (b.p||0) - (a.p||0));
  else if (sort === 'fl') filtered.sort((a,b) => (isFL(b) - isFL(a)) || (a.dt||'').localeCompare(b.dt||''));
  else filtered.sort((a,b) => (a.dt||'z').localeCompare(b.dt||'z'));

  $('stat-shown').textContent = filtered.length;
  if (currentView === 'grid') renderGrid(filtered);
  else if (currentView === 'map') renderMap(filtered);
}

function renderGrid(filtered){
  const disc = (parseFloat($('f-disc').value) || 0) / 100;
  const markup = (parseFloat($('f-mup').value) || 0) / 100;
  const grid = $('view-grid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty">No legs match your filters.</div>'; return; }
  grid.innerHTML = filtered.slice(0, 300).map(l => {
    const fl = isFL(l);
    const img = l.img
      ? `<div class="card-img" style="background-image:url('${esc(l.img)}')"><div class="card-src">${esc(l.src)}</div>${fl?'<div class="card-fl">FL ★</div>':''}</div>`
      : `<div class="card-img placeholder">NO PHOTO<div class="card-src">${esc(l.src)}</div>${fl?'<div class="card-fl">FL ★</div>':''}</div>`;
    let price;
    if (l.p) {
      const net = l.p * (1 - disc);
      const quote = net * (1 + markup);
      price = `${fmtPrice(l.p)} <span style="font-size:11px;color:var(--text-muted)">retail</span>
        <div class="broker-tier">
          <span class="net">${fmtPrice(net)}</span> net · <span class="quote">${fmtPrice(quote)}</span> your quote
        </div>`;
    } else { price = '<span style="color:var(--text-muted);font-size:14px">Quote on request</span>'; }
    const phase = l.phase ? `<span class="phase-pill phase-${l.phase.toLowerCase().replace(/[^a-z]/g,'')}">${l.phase}</span>` : '';
    // Operator block — direct source operator first, then inferred as fallback
    const hasDirectOp = l.op && l.op !== 'EmptyJet Marketplace' && !l.op.startsWith('N');
    const opBlocks = [];

    if (hasDirectOp) {
      const direct = [];
      if (l.ph) direct.push(`<a href="tel:${esc(l.ph)}">📞 ${esc(l.ph)}</a>`);
      if (l.em) direct.push(`<a href="mailto:${esc(l.em)}?subject=Empty%20leg%20${esc(l.o)}-${esc(l.d)}%20${esc(l.dt||'')}">✉ Email</a>`);
      opBlocks.push(`
        <div class="direct-marker">✓ Direct operator</div>
        <div class="op-name">${esc(l.op)}${l.hb?' <span style="color:var(--text-muted);font-size:11px">· '+esc(l.hb)+'</span>':''}</div>
        ${direct.length ? `<div class="op-contacts">${direct.join('')}</div>` : ''}
      `);
    }

    if (l.iop) {
      const infr = [];
      if (l.iph) infr.push(`<a href="tel:${esc(l.iph)}">📞 ${esc(l.iph)}</a>`);
      if (l.iem) infr.push(`<a href="mailto:${esc(l.iem)}?subject=Empty%20leg%20${esc(l.o)}-${esc(l.d)}%20${esc(l.dt||'')}%20-%20Inquiry">✉ Email</a>`);
      if (l.iws) infr.push(`<a href="${esc(l.iws)}" target="_blank">🌐 Site</a>`);
      const confClass = 'conf-' + (l.iconf||'low').toLowerCase();
      const markerTxt = hasDirectOp ? 'Also likely' : '⚠ Inferred from fleet + hub';
      opBlocks.push(`
        <div class="inferred-marker" style="margin-top:${hasDirectOp?'8px':'0'}">${markerTxt}</div>
        <div class="op-name">${esc(l.iop)}<span class="conf-pill ${confClass}">${esc(l.iconf||'')}</span></div>
        ${infr.length ? `<div class="op-contacts">${infr.join('')}</div>` : ''}
      `);
    }

    // Booking fallback (EmptyJet or source URL)
    const fallback = [];
    if (!hasDirectOp && !l.iop && l.ph) fallback.push(`<a href="tel:${esc(l.ph)}">📞 ${esc(l.ph)}</a>`);
    if (!hasDirectOp && !l.iop && l.em) fallback.push(`<a href="mailto:${esc(l.em)}">✉ Email</a>`);
    if (l.url) fallback.push(`<a href="${esc(l.url)}" target="_blank">🔗 Source</a>`);
    if (fallback.length) {
      const label = (!hasDirectOp && !l.iop) ? 'Marketplace booking' : 'Source';
      opBlocks.push(`<div class="inferred-marker" style="margin-top:8px">${label}</div><div class="op-contacts">${fallback.join('')}</div>`);
    }

    return `
    <div class="card ${fl?'fl':''}">
      ${img}
      <div class="card-body">
        <div class="card-route">${esc(l.o)}<span class="arrow">→</span>${esc(l.d)}</div>
        <div class="card-cities">${esc(l.oc||'')}${l.dc?' → '+esc(l.dc):''}</div>
        ${phase}
        <div class="card-meta">
          <div class="meta-item"><div class="label">Date</div><div class="value">${fmtDate(l.dt)}${l.tm?' · '+esc(l.tm):''}</div></div>
          <div class="meta-item"><div class="label">Aircraft</div><div class="value">${esc(l.ac||'—')}${l.tail?'<div class="card-tail">'+esc(l.tail)+'</div>':''}</div></div>
          <div class="meta-item"><div class="label">Seats</div><div class="value">${l.px||'—'}</div></div>
        </div>
        <div class="card-price">${price}</div>
        <div class="card-view-on-map" onclick="viewOnMap('${esc(l.o)}','${esc(l.d)}')">📍 View on map</div>
        <div class="card-ops">
          ${opBlocks.join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

function initMap(){
  if (map) return;
  map = L.map('map', { center: [26.5, -70], zoom: 4, minZoom: 2, worldCopyJump: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap | JETLUXECO cockpit', maxZoom: 18,
  }).addTo(map);
  routesLayer = L.layerGroup().addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(filtered){
  if (!map) return;
  routesLayer.clearLayers();
  markersLayer.clearLayers();
  const coords = window.__COORDS__;
  const seenAirports = new Set();
  const bounds = [];
  let plotted = 0;

  filtered.forEach(l => {
    const oc = coords[l.o]; const dc = coords[l.d];
    if (!oc || !dc) return;
    plotted++;
    const fl = isFL(l);
    const us = isUS(l);
    const color = fl ? '#AE7640' : (us ? '#5cb85c' : '#6699cc');
    const weight = fl ? 2.5 : 1.5;
    const opacity = fl ? 0.85 : 0.5;

    const line = L.polyline([[oc.lat, oc.lon],[dc.lat, dc.lon]], { color, weight, opacity, smoothFactor: 1 });
    const priceHtml = l.p ? `<div style="color:var(--gold);font-size:14px;margin-top:4px">${fmtPrice(l.p)}</div>` : '';
    const hasDirectOp = l.op && l.op !== 'EmptyJet Marketplace' && !l.op.startsWith('N');
    const opShown = hasDirectOp ? l.op : (l.iop ? l.iop + ' ('+(l.iconf||'?')+')' : (l.op||'Operator withheld'));
    const opHtml = `<div style="margin-top:4px">${esc(opShown)}</div>`;
    const phoneForCall = hasDirectOp ? l.ph : (l.iph || l.ph);
    const contactHtml = phoneForCall ? `<a href="tel:${esc(phoneForCall)}" style="color:var(--gold);font-size:11px">📞 ${esc(phoneForCall)}</a>` : '';
    line.bindPopup(`
      <strong>${esc(l.o)} → ${esc(l.d)}</strong><br>
      ${esc(l.oc||'')} → ${esc(l.dc||'')}<br>
      <span style="color:var(--text-muted);font-size:11px">${fmtDate(l.dt)}${l.tm?' · '+esc(l.tm):''}</span><br>
      <span style="font-size:12px">${esc(l.ac||'—')}${l.tail?' · '+esc(l.tail):''}</span>
      ${priceHtml}
      ${opHtml}
      ${contactHtml}
    `);
    line.addTo(routesLayer);
    bounds.push([oc.lat, oc.lon], [dc.lat, dc.lon]);

    [[l.o, oc], [l.d, dc]].forEach(([icao, c]) => {
      if (seenAirports.has(icao)) return;
      seenAirports.add(icao);
      const isFla = FL_ICAOS.includes(icao);
      const m = L.circleMarker([c.lat, c.lon], {
        radius: isFla ? 6 : 4,
        color: isFla ? '#AE7640' : '#f5f5f5',
        fillColor: isFla ? '#AE7640' : '#141414',
        fillOpacity: 0.9,
        weight: 2,
      });
      m.bindPopup(`<strong>${esc(icao)}</strong><br>${esc(c.name||'')}<br>${esc(c.city||'')} ${esc(c.country||'')}`);
      m.addTo(markersLayer);
    });
  });

  if (bounds.length && quickFilter !== 'all') {
    try { map.fitBounds(bounds, { padding: [50, 50] }); } catch(e){}
  }

  $('stat-shown').textContent = plotted + ' / ' + filtered.length;
}

function viewOnMap(o, d){
  document.querySelectorAll('.vt').forEach(x => x.classList.remove('active'));
  document.querySelector('.vt[data-view="map"]').classList.add('active');
  currentView = 'map';
  $('view-grid').style.display = 'none';
  $('view-map').style.display = 'block';
  initMap();
  const coords = window.__COORDS__;
  const oc = coords[o]; const dc = coords[d];
  if (oc && dc) {
    apply();
    setTimeout(() => {
      map.invalidateSize();
      map.fitBounds([[oc.lat, oc.lon],[dc.lat, dc.lon]], { padding: [80, 80] });
    }, 300);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const data = window.__DATA__;
  $('stat-total').textContent = data.length;
  $('stat-fl').textContent = data.filter(isFL).length;
  $('stat-photos').textContent = data.filter(l => l.img).length;
  apply();
});
</script>

</body>
</html>
